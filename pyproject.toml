[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vidphen"
version = "1.0"
description = "Download YouTube videos and playlists from your terminal"
requires-python = ">=3.9"
dependencies = ["yt-dlp>=2023.0.0"]

[project.scripts]
vidphen = "vidphen.cli:main"

[tool.setuptools.packages.find]
include = ["vidphen*"]
